<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 4 – JavaScript Nâng Cao (OOP & Module)</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #f7f7f8;
      padding: 40px 20px;
      font-family: 'Inter', sans-serif;
    }
    .lab-box {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .form-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .form-group input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
    }
    .form-group button {
      background: #111;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
    }
    ul {
      list-style: none;
      margin-bottom: 24px;
    }
    li {
      padding: 12px 16px;
      background: #f7f7f8;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    li button {
      margin-left: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="lab-box">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
    <h1>Lab 4 – OOP & Module Demo</h1>
    <a href="index.html" style="font-weight:700; color:#111;">← Về Trang Chủ</a>
  </div>

  <h2>+ Thêm Giày Mới</h2>
  <div class="form-group">
    <input type="text" id="shoeName" placeholder="Tên giày" />
    <input type="number" id="shoePrice" placeholder="Giá giày" />
    <button id="btnAdd" onclick="addShoe()">Thêm Giày</button>
  </div>

  <h2>Danh Sách Giày (db.json)</h2>
  <ul id="shoeList"></ul>

  <h2>Giỏ Hàng 5 Dòng</h2>
  <ul id="cartList"></ul>
  <p style="font-size:1.2rem; font-weight:800;">Tổng tiền: <strong id="totalPrice" style="color:#e11d48;">0₫</strong></p>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
