<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập – SneakerZone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <h2>SneakerZone</h2>
      <p>Đăng nhập để tiếp tục mua sắm</p>
    </div>

    <!-- Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="your@email.com" />
        <div class="error-msg" id="emailError">Email không hợp lệ!</div>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu..." />
        <div class="error-msg" id="passwordError">Mật khẩu ít nhất 6 ký tự!</div>
      </div>

      <div class="error-msg" id="loginError" style="display:block; margin-bottom:12px;"></div>

      <button type="submit" class="btn-submit">Đăng nhập</button>
    </form>

    <!-- Hint -->
    <div class="login-hint">
      <strong>Tài khoản demo:</strong><br/>
      Admin: <code>admin@shoes.com</code> / <code>Admin@123</code><br/>
      User: <code>user@shoes.com</code> / <code>User@123</code>
    </div>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
